name: Build QuickPad

# Сборка APK (Android) и EXE (Windows) в облаке GitHub — без локальной установки.
# Запуск: вручную (Actions → Build QuickPad → Run workflow) или по пушу в main.
# Готовые файлы: раздел Artifacts на странице запуска (APK и ZIP с Windows-приложением).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quickpad-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows EXE (хост)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: quickpad-windows
          path: build/windows/x64/runner/Release/
